<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Happa">
<meta name="theme-color" content="#CC0000">
<meta name="description" content="Njia smart ya ku-run bizna">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/happa-logo.jpg">
<title>Happa Merchant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#080D1A;--surf:#101724;--surf2:#182030;--bdr:#263040;
  --acc:#F5A623;--acc-d:rgba(245,166,35,.14);
  --grn:#22C55E;--grn-d:rgba(34,197,94,.13);
  --red:#EF4444;--red-d:rgba(239,68,68,.12);
  --blu:#3B82F6;
  --txt:#EEF2FF;--txt2:#8B9EC0;--txt3:#4B5E7A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:101}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}
.page{display:none;flex:1;overflow-y:auto;overflow-x:hidden}
.page.on{display:flex;flex-direction:column}

/* ── AUTH PAGE ── */
.auth-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px))}
.auth-logo{width:100px;height:100px;border-radius:50%;overflow:hidden;margin-bottom:12px;box-shadow:0 8px 32px rgba(204,0,0,.4)}
.auth-logo img{width:100%;height:100%;object-fit:cover}
.auth-title{font-size:24px;font-weight:800;margin-bottom:4px;text-align:center}
.auth-sub{font-size:14px;color:var(--txt2);text-align:center;margin-bottom:32px}
.auth-card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:24px;width:100%}
.fg{margin-bottom:16px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:6px;letter-spacing:.03em}
.fi{width:100%;padding:11px 14px;background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;color:var(--txt);font-family:inherit;font-size:15px;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--acc)}
.fi::placeholder{color:var(--txt3)}
.btn-p{width:100%;padding:13px;background:var(--acc);color:#08122A;border:none;border-radius:11px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:opacity .15s}
.btn-p:hover{opacity:.9}
.btn-p:disabled{opacity:.5;cursor:default}
.err-msg{font-size:12px;color:var(--red);text-align:center;margin-top:12px;display:none}

/* ── HEADER ── */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surf);border-bottom:1px solid var(--bdr);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;z-index:100;flex-shrink:0}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:36px;height:36px;background:var(--acc);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#08122A;flex-shrink:0;overflow:hidden}
.hdr-logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.hdr-name{font-size:14px;font-weight:700}
.hdr-role{font-size:10px;color:var(--txt2);margin-top:1px}
.hdr-acts{display:flex;gap:6px}
.ico-btn{width:34px;height:34px;background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--txt2);border:none;transition:background .15s;flex-shrink:0}
.ico-btn:hover{background:var(--bdr)}

/* ── BOTTOM NAV ── */
.bnav{background:var(--surf);border-top:1px solid var(--bdr);padding:6px max(8px,env(safe-area-inset-right,0px)) max(12px,calc(6px + env(safe-area-inset-bottom,0px))) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around;flex-shrink:0}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1;padding:5px 4px;border-radius:10px;border:none;background:transparent;color:var(--txt3);transition:background .15s;font-family:inherit}
.ni.on{color:var(--acc)}
.ni:hover{background:var(--surf2)}
.ni-ico{font-size:19px;line-height:1}
.ni-lbl{font-size:10px;font-weight:700;letter-spacing:.02em}

/* ── MAIN CONTENT ── */
.main{flex:1;overflow-y:auto;padding-bottom:8px}
.sec{padding:14px max(16px,env(safe-area-inset-right,0px)) 0}
.sec-ttl{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,#E69520,#C87C18);border-radius:18px;padding:20px;color:#08122A;margin:14px max(16px,env(safe-area-inset-right,0px)) 0;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;background:rgba(255,255,255,.08);border-radius:50%}
.hero-lbl{font-size:12px;font-weight:600;opacity:.7;margin-bottom:3px}
.hero-amt{font-size:36px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
.hero-sub{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:12px;font-weight:500;opacity:.8}

/* ── STATS ROW ── */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 0}
.scard{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:12px 10px}
.scard-lbl{font-size:10px;color:var(--txt2);margin-bottom:3px}
.scard-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.scard-sub{font-size:10px;color:var(--txt3);margin-top:2px}
.bdg{display:inline-block;font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;margin-top:3px}
.bdg-g{background:var(--grn-d);color:var(--grn)}
.bdg-r{background:var(--red-d);color:var(--red)}
.bdg-a{background:var(--acc-d);color:var(--acc)}

/* ── ALERT ── */
.alert-b{margin:10px max(16px,env(safe-area-inset-right,0px)) 0;background:var(--red-d);border:1px solid rgba(239,68,68,.18);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.alert-ico{font-size:18px}
.alert-txt{flex:1}
.alert-ttl{font-size:13px;font-weight:600;color:var(--red)}
.alert-sub{font-size:11px;color:var(--txt2);margin-top:1px}

/* ── FAB ── */
.fab{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#08122A;border:none;border-radius:14px;padding:0 20px;height:52px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;width:calc(100% - max(32px,calc(env(safe-area-inset-left,0px) + env(safe-area-inset-right,0px))));margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));transition:opacity .15s,transform .1s}
.fab:hover{opacity:.92}
.fab:active{transform:scale(.98)}

/* ── CARD LIST ── */
.clist{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;margin:10px max(16px,env(safe-area-inset-right,0px)) 0}

/* ── TX ITEM ── */
.txi{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bdr);transition:background .1s;cursor:default}
.txi:last-child{border-bottom:none}
.tx-ico{width:38px;height:38px;border-radius:10px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-inf{flex:1;min-width:0}
.tx-nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-mt{font-size:11px;color:var(--txt2);margin-top:2px}
.tx-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--grn);text-align:right;flex-shrink:0}
.tx-amt.debt{color:var(--red)}
.tx-amt.mpesa{color:var(--blu)}

/* ── FILTER ROW ── */
.frow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px max(16px,env(safe-area-inset-right,0px)) 0}
.frow::-webkit-scrollbar{display:none}
.fchip{padding:6px 14px;border-radius:20px;flex-shrink:0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--bdr);color:var(--txt2);background:transparent;transition:all .15s}
.fchip.on{background:var(--surf2);color:var(--txt);border-color:var(--txt2)}

/* ── STOCK ── */
.sti{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bdr)}
.sti:last-child{border-bottom:none}
.st-ico{width:38px;height:38px;border-radius:10px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.st-inf{flex:1;min-width:0}
.st-nm{font-size:14px;font-weight:600}
.st-pr{font-size:11px;color:var(--txt2);margin-top:1px}
.st-lvl{width:80px;text-align:right;flex-shrink:0}
.st-cnt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.st-bar{width:80px;height:4px;background:var(--bdr);border-radius:2px;margin-top:5px}
.st-fill{height:100%;border-radius:2px}

/* ── DEBT ITEM ── */
.dbi{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
.dbi:hover{background:var(--surf2)}
.dbi:last-child{border-bottom:none}
.db-av{width:38px;height:38px;border-radius:12px;background:var(--red-d);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--red);flex-shrink:0}
.db-inf{flex:1;min-width:0}
.db-nm{font-size:14px;font-weight:600}
.db-mt{font-size:11px;color:var(--txt2);margin-top:2px}
.db-amt{text-align:right;flex-shrink:0}
.db-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--red)}
.db-days{font-size:10px;color:var(--txt3);margin-top:2px}

/* ── SHEET / OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(6px)}
.overlay.on{display:flex}
.sheet{background:var(--surf);border-radius:22px 22px 0 0;width:100%;max-width:480px;margin:0 auto;padding:0 0 max(24px,env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-hand{width:40px;height:4px;background:var(--bdr);border-radius:2px;margin:12px auto 0}
.sh-hdr{padding:12px 20px 14px;border-bottom:1px solid var(--bdr)}
.sh-hdr h2{font-size:18px;font-weight:700}
.sh-body{padding:16px 20px}
.fg-s{margin-bottom:14px}
.method-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.method-btn{padding:10px 6px;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:10px;text-align:center;cursor:pointer;font-family:inherit;color:var(--txt2);font-size:12px;font-weight:600;transition:all .15s}
.method-btn.sel{border-color:var(--acc);background:var(--acc-d);color:var(--acc)}
.method-btn .m-ico{font-size:18px;display:block;margin-bottom:3px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pc{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:11px;padding:10px 7px;text-align:center;cursor:pointer;transition:all .15s}
.pc:hover{border-color:var(--acc)}
.pc.sel{border-color:var(--acc);background:var(--acc-d)}
.pc-em{font-size:22px}
.pc-nm{font-size:10px;font-weight:600;margin-top:3px;color:var(--txt);line-height:1.2}
.pc-pr{font-size:10px;color:var(--txt2);margin-top:2px}
.qty-wrap{display:flex;align-items:center;gap:8px}
.qty-btn{width:40px;height:40px;background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;font-size:20px;cursor:pointer;color:var(--txt);display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .15s}
.qty-btn:hover{background:var(--bdr)}
.qty-inp{width:64px;text-align:center}
.tot-box{background:var(--surf2);border-radius:12px;padding:14px;margin-bottom:14px}
.tot-row{display:flex;justify-content:space-between;align-items:center}
.tot-lbl{font-size:13px;color:var(--txt2)}
.tot-val{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.btn-g{background:transparent;border:1px solid var(--bdr);color:var(--txt2);border-radius:12px;padding:12px;font-family:inherit;font-size:14px;cursor:pointer;width:100%;margin-top:8px;transition:background .15s}
.btn-g:hover{background:var(--surf2)}
.btn-sm{background:var(--surf2);border:1px solid var(--bdr);color:var(--txt);border-radius:8px;padding:6px 14px;font-family:inherit;font-size:12px;cursor:pointer;transition:background .15s}
.btn-sm:hover{background:var(--bdr)}

/* ── TOAST ── */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);background:#0D2B1A;border:1px solid var(--grn);color:var(--grn);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;max-width:90%}
.toast.err{background:#2B0D0D;border-color:var(--red);color:var(--red)}
.toast.on{opacity:1}

/* ── LOADING ── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:14px;flex:1}
.spin{width:36px;height:36px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-msg{font-size:13px;color:var(--txt2)}

/* ── MORE / SETTINGS ── */
.more-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
.more-item:hover{background:var(--surf2)}
.more-item:last-child{border-bottom:none}
.more-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.more-inf{flex:1}
.more-nm{font-size:14px;font-weight:600}
.more-mt{font-size:11px;color:var(--txt2);margin-top:1px}

/* ── EMPTY STATE ── */
.empty{padding:36px 20px;text-align:center;color:var(--txt2);display:flex;flex-direction:column;align-items:center}
.empty-ico{font-size:38px;margin-bottom:12px}
.empty p{font-size:13px;line-height:1.6}

/* ── CONFIRM ── */
.conf-box{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:24px;margin:20px;position:relative;top:30%}
.conf-ttl{font-size:16px;font-weight:700;margin-bottom:6px}
.conf-msg{font-size:13px;color:var(--txt2);margin-bottom:18px;line-height:1.5}
.conf-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── CART ITEM ── */
.cart-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr)}
.cart-item:last-child{border-bottom:none}
.cart-em{font-size:20px;width:32px;text-align:center;flex-shrink:0}
.cart-inf{flex:1;min-width:0}
.cart-nm{font-size:13px;font-weight:600}
.cart-pr{font-size:11px;color:var(--txt2)}
.cart-ctl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cart-ctl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .15s}
.cart-ctl button:hover{background:var(--bdr)}
.cart-ctl span{width:24px;text-align:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
/* ── BAR CHART ── */
.bar-wrap{display:flex;align-items:flex-end;gap:5px;height:96px;margin-top:4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-rect{width:100%;border-radius:5px 5px 0 0;min-height:3px;background:var(--surf2);border:1px solid var(--bdr)}
.bar-rect.has{background:var(--acc);border-color:var(--acc)}
.bar-rect.tod{background:var(--grn);border-color:var(--grn)}
.bar-lbl{font-size:9px;color:var(--txt3)}
.bar-v{font-size:9px;color:var(--txt2);font-variant-numeric:tabular-nums}
.chart-card{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:14px 16px;margin:10px max(16px,env(safe-area-inset-right,0px)) 0}
.chart-ttl{font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<div id="app">

  <!-- ── AUTH PAGE ── -->
  <div class="page on" id="page-auth">
    <div class="auth-wrap">
      <div class="auth-logo"><img src="/happa-logo.jpg" alt="Happa"></div>
      <div class="auth-title">Happa Merchant</div>
      <div class="auth-sub">Njia smart ya ku-run bizna</div>
      <div id="install-bar" style="display:none;margin-bottom:16px;width:100%;max-width:400px">
        <button id="install-btn" onclick="installApp()" style="width:100%;padding:10px;background:#CC0000;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
          📲 Install Happa on your phone
        </button>
      </div>
      <div class="auth-card">
        <div class="fg"><label class="fl">Email Address</label>
          <input class="fi" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
        <div class="fg" style="margin-bottom:20px"><label class="fl">Password</label>
          <input class="fi" id="auth-pwd" type="password" placeholder="Your password" autocomplete="current-password"></div>
        <button class="btn-p" id="auth-btn" onclick="doLogin()">Sign In</button>
        <div class="err-msg" id="auth-err"></div>
      </div>
    </div>
  </div>

  <!-- ── SET PASSWORD PAGE ── -->
  <div class="page" id="page-setpwd">
    <div class="auth-wrap">
      <div class="auth-logo">🔑</div>
      <div class="auth-title">Set Your Password</div>
      <div class="auth-sub">You're in! Create a password for your account.</div>
      <div class="auth-card">
        <div class="fg"><label class="fl">New Password</label>
          <input class="fi" id="new-pwd" type="password" placeholder="At least 8 characters" autocomplete="new-password"></div>
        <div class="fg" style="margin-bottom:20px"><label class="fl">Confirm Password</label>
          <input class="fi" id="new-pwd2" type="password" placeholder="Repeat password" autocomplete="new-password"></div>
        <button class="btn-p" id="setpwd-btn" onclick="doSetPassword()">Set Password & Continue</button>
        <div class="err-msg" id="setpwd-err"></div>
      </div>
    </div>
  </div>

  <!-- ── LOADING PAGE ── -->
  <div class="page" id="page-loading">
    <div class="loader"><div class="spin"></div><div class="loader-msg">Loading your shop…</div></div>
  </div>

  <!-- ── NO SHOP PAGE ── -->
  <div class="page" id="page-noshop">
    <div class="auth-wrap">
      <div class="auth-logo">⏳</div>
      <div class="auth-title">Almost there</div>
      <div class="auth-sub">Your shop hasn't been set up yet. Contact the administrator to complete your onboarding.</div>
      <button class="btn-p" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <!-- ── MAIN APP ── -->
  <div class="page" id="page-app" style="flex-direction:column">
    <header class="hdr">
      <div class="hdr-brand">
        <div class="hdr-logo" id="hdr-logo-el"><img src="/happa-logo.jpg" alt="H"></div>
        <div>
          <div class="hdr-name" id="hdr-shop-name">My Shop</div>
          <div class="hdr-role" id="hdr-role-badge">Owner</div>
        </div>
      </div>
      <div class="hdr-acts">
        <button class="ico-btn" onclick="openSaleSheet()" title="Record sale">＋</button>

/* ═══════════════════════════════
   RAW API HELPERS
   (bypass supabase-js .from() which hangs on this version)
═══════════════════════════════ */
function apiHeaders(extras = {}) {
  return {
    'Authorization': `Bearer ${currentSession?.access_token ?? ''}`,
    'apikey': SUPABASE_KEY,
    'Accept': 'application/json',
    ...extras,
  };
}
async function apiGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: apiHeaders() });
  if (!res.ok) return [];
  return res.json().catch(() => []);
}
async function apiPost(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { ...apiHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    return { data: null, error: { message: err.message || err.details || `HTTP ${res.status}` } };
  }
  const data = await res.json().catch(() => null);
  return { data: Array.isArray(data) ? data[0] : data, error: null };
}
async function apiPatch(table, filter, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
    method: 'PATCH',
    headers: { ...apiHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify(body),
  });
  return { error: res.ok ? null : { message: `HTTP ${res.status}` } };
}

/* ═══════════════════════════════
   INIT
═══════════════════════════════ */
(async function init() {
  // Must check hash BEFORE getSession() — Supabase clears it after processing
  const hash = window.location.hash;
  if (hash.includes('type=invite') || hash.includes('type=signup') || hash.includes('type=recovery')) {
    S.pendingPwdSetup = true;
  }

  // Race getSession against 3s — supabase-js@2.50.0 hangs on this call
  const session = await Promise.race([
    db.auth.getSession().then(r => r.data?.session ?? null).catch(() => null),
    new Promise(r => setTimeout(() => r(null), 3000)),
  ]);
  if (session) {
    currentSession = session;
    S.user = session.user;
    if (S.pendingPwdSetup) { showPage('setpwd'); }
    else { await loadUserContext(); }
  } else {
    showPage('auth');
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') { currentSession = null; S.user = null; showPage('auth'); }
    if (event === 'TOKEN_REFRESHED' && session) { currentSession = session; }
  });

  // Enter key on auth inputs
  ['auth-email','auth-pwd'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  });
  ['new-pwd','new-pwd2'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown', e=>{ if(e.key==='Enter') doSetPassword(); });
  });
})();

/* ═══════════════════════════════
   AUTH
═══════════════════════════════ */
async function doLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const pwd   = document.getElementById('auth-pwd').value;
  const btn   = document.getElementById('auth-btn');
  const err   = document.getElementById('auth-err');
  if (!email || !pwd) { showErr(err,'Enter your email and password'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { data, error } = await db.auth.signInWithPassword({ email, password: pwd });
  btn.disabled = false; btn.textContent = 'Sign In';
  if (error) { showErr(err, error.message); return; }
  if (data?.session) {
    currentSession = data.session;
    S.user = data.session.user;
    if (S.pendingPwdSetup) { showPage('setpwd'); return; }
    await loadUserContext();
  }
}

async function doSetPassword() {
  const p1 = document.getElementById('new-pwd').value;
  const p2 = document.getElementById('new-pwd2').value;
  const err = document.getElementById('setpwd-err');
  const btn = document.getElementById('setpwd-btn');
  if (p1.length < 8) { showErr(err,'Password must be at least 8 characters'); return; }
  if (p1 !== p2)     { showErr(err,"Passwords don't match"); return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  // Raw fetch — db.auth.updateUser() hangs on supabase-js@2.50.0
  const pwRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method: 'PUT',
    headers: { ...apiHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: p1 }),
  });
  btn.disabled = false; btn.textContent = 'Set Password & Continue';
  if (!pwRes.ok) {
    const e = await pwRes.json().catch(() => ({}));
    showErr(err, e.message || 'Failed to update password'); return;
  }
  S.pendingPwdSetup = false;
  window.history.replaceState(null, '', window.location.pathname);
  await loadUserContext();
}

async function doLogout() {
  try {
    await fetch(`${SUPABASE_URL}/auth/v1/logout?scope=local`, {
      method: 'POST', headers: apiHeaders(),
    });
  } catch(e) { /* ignore */ }
  currentSession = null; S.user = null;
  showPage('auth');
}

function showErr(el, msg) {

function openSaleSheet() {

function addToCart(pid) {
  const p = S.products.find(x=>x.id===pid);
  if (!p) return;
  const ex = S.cart.find(x=>x.product.id===pid);
  if (ex) ex.qty++; else S.cart.push({product:p, qty:1});
  renderSaleSheet();
}

function removeFromCart(pid) {
  S.cart = S.cart.filter(x=>x.product.id!==pid);
  renderSaleSheet();
}

function cartQty(pid, delta) {
  const item = S.cart.find(x=>x.product.id===pid);
  if (!item) return;
  item.qty = Math.max(1, item.qty + delta);
  renderSaleSheet();
}

function getCartTotal()  { return S.cart.reduce((a,x)=>a+x.product.sell_price*x.qty, 0); }
function getCartProfit() { return S.cart.reduce((a,x)=>a+(x.product.sell_price-x.product.buy_price)*x.qty, 0); }

function renderSaleSheet() {
  let pg = '';
  S.products.forEach(p => {
    const inCart = S.cart.find(x=>x.product.id===p.id);
    const low = p.stock <= p.low_stock_at;

    </div>`;
  });

  let cartHtml = '';
  if (S.cart.length > 0) {
    const total  = getCartTotal();
    const profit = getCartProfit();
    cartHtml = `<div class="fg-s"><label class="fl">Cart (${S.cart.length} item${S.cart.length!==1?'s':''})</label>
      <div style="background:var(--surf2);border-radius:12px;padding:4px 12px">`;
    S.cart.forEach(item => {

      cartHtml += `<div class="cart-item">

        <div class="cart-inf">
          <div class="cart-nm">${p.name}</div>
          <div class="cart-pr">${kes(p.sell_price)} · Subtotal ${kes(p.sell_price*item.qty)}</div>
        </div>
        <div class="cart-ctl">
          <button onclick="cartQty('${p.id}',-1)">−</button>
          <span>${item.qty}</span>
          <button onclick="cartQty('${p.id}',1)">+</button>
          <button onclick="removeFromCart('${p.id}')" style="color:var(--red);margin-left:2px">✕</button>
        </div>
      </div>`;
    });
    cartHtml += `</div></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div><label class="fl">Customer (optional)</label>
        <input type="text" id="cust-inp" class="fi" placeholder="Walk-in" list="cust-list" autocomplete="off">
        <datalist id="cust-list">${S.customers.map(c=>`<option value="${c.name}">`).join('')}</datalist>
      </div>

    </div>

    <label class="fl">Payment Method</label>
    <div class="method-row">
      <button class="method-btn ${S.smethod==='cash'?'sel':''}" onclick="setMethod('cash')"><span class="m-ico">💵</span>Cash</button>
      <button class="method-btn ${S.smethod==='mpesa'?'sel':''}" onclick="setMethod('mpesa')"><span class="m-ico">📱</span>M-Pesa</button>
      <button class="method-btn ${S.smethod==='debt'?'sel':''}" onclick="setMethod('debt')"><span class="m-ico">📋</span>Debt</button>

async function confirmSale() {
  if (S.cart.length === 0) { showToast('Add at least one item', true); return; }

  const custName = (document.getElementById('cust-inp')?.value||'').trim() || 'Walk-in';

  if (S.smethod === 'debt' && custName === 'Walk-in') {
    showToast('Enter customer name for debt sales', true); return;
  }

  const mpesaCode = S.smethod === 'mpesa' ? (document.getElementById('mpesa-code')?.value||'').trim().toUpperCase() : null;
  if (S.smethod === 'mpesa' && !mpesaCode) { showToast('M-Pesa code is required', true); return; }

  if (S.smethod === 'mpesa') {
    const dup = await apiGet(`sales?shop_id=eq.${S.shop.id}&mpesa_code=eq.${mpesaCode}&select=id&limit=1`);
    if (dup?.length) { showToast('This M-Pesa code is already recorded', true); return; }
  }

  const dueDate = S.smethod === 'debt' ? (document.getElementById('debt-due')?.value||null) : null;
  const btn = document.querySelector('#sale-sheet .btn-p');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  // Upsert customer
  let custId = null;
  if (custName !== 'Walk-in') {
    let cust = S.customers.find(c => c.name.toLowerCase() === custName.toLowerCase());
    if (!cust) {
      const { data: nc } = await apiPost('customers', { shop_id: S.shop.id, name: custName });
      cust = nc; if (cust) S.customers.push(cust);
    }
    custId = cust?.id || null;
  }

  // Insert one sale row per cart item
  let totalDebtAmt = 0, lastSaleId = null, savedCount = 0;
  for (const item of S.cart) {
    const p = item.product;
    const saleTotal  = p.sell_price * item.qty;
    const saleProfit = (p.sell_price - p.buy_price) * item.qty;
    const saleObj = {
      shop_id: S.shop.id, product_id: p.id, product_name: p.name, product_emoji: p.emoji||'📦',
      qty: item.qty, unit_price: p.sell_price, buy_price: p.buy_price,
      total: saleTotal, profit: saleProfit,
      payment_method: S.smethod,
      mpesa_code: savedCount === 0 ? mpesaCode : null,
      customer_id: custId, customer_name: custName,
      recorded_by: S.user.id,
    };
    const { data: ns, error } = await apiPost('sales', saleObj);
    if (error) {
      showToast('Error saving sale: ' + error.message, true);
      if (btn) { btn.disabled = false; btn.textContent = 'Confirm Sale ✓'; }
      return;
    }
    await apiPatch('products', `id=eq.${p.id}`, { stock: Math.max(0, p.stock - item.qty) });
    const local = S.products.find(x=>x.id===p.id);
    if (local) local.stock = Math.max(0, local.stock - item.qty);
    if (S.smethod === 'debt') { totalDebtAmt += saleTotal; lastSaleId = ns?.id; }
    savedCount++;
  }

  // Create single debt record for entire transaction
  if (S.smethod === 'debt' && custId && totalDebtAmt > 0) {
    await apiPost('debts', {
      shop_id: S.shop.id, customer_id: custId, sale_id: lastSaleId,
      original_amt: totalDebtAmt, balance: totalDebtAmt,
      due_date: dueDate, status: 'outstanding',
    });
    const lc = S.customers.find(c=>c.id===custId);
    await apiPatch('customers', `id=eq.${custId}`, { outstanding: (lc?.outstanding||0) + totalDebtAmt });
  }

  const cartTot = getCartTotal();
  closeSaleSheet();
  S.cart = [];
  showToast(`✓ ${savedCount} item${savedCount!==1?'s':''} sold — ${kes(cartTot)}`);
  showTab(S.tab);
}

async function recordDebtPayment(debtId, originalBalance) {
  const amt = parseFloat(document.getElementById('pay-amt')?.value);
  if (!amt || amt <= 0) { showToast('Enter amount received', true); return; }
  const useMpesa = document.getElementById('pm-mpesa')?.classList.contains('sel');
  const mpesaCode = useMpesa ? (document.getElementById('pay-mpesa-code')?.value||'').trim().toUpperCase() : null;
  if (useMpesa && !mpesaCode) { showToast('M-Pesa code required', true); return; }

  const newBalance = Math.max(0, originalBalance - amt);
  const newStatus  = newBalance === 0 ? 'paid' : 'partial';

  const { error } = await apiPost('debt_payments', {
    debt_id: debtId, shop_id: S.shop.id, amount: amt,
    payment_method: useMpesa ? 'mpesa' : 'cash', mpesa_code: mpesaCode,
    recorded_by: S.user.id,
  });

  if (error) { showToast('Error: ' + error.message, true); return; }

  await apiPatch('debts', `id=eq.${debtId}`, { balance: newBalance, status: newStatus, updated_at: new Date().toISOString() });

  closeSaleSheet();
  showToast(newBalance === 0 ? `✓ Debt cleared — ${kes(amt)} received` : `✓ ${kes(amt)} received — ${kes(newBalance)} remaining`);
  showTab('debts');
}

/* ═══════════════════════════════
   HELPERS
═══════════════════════════════ */
function kes(n) { return 'KES ' + Math.round(n||0).toLocaleString('en-KE'); }
function kshort(n) { n=Math.round(n||0); return n>=1000?(n/1000).toFixed(1)+'k':n.toString(); }
function sum(arr, key) { return (arr||[]).reduce((a,x)=>a+(x[key]||0), 0); }
function todayStart() { const d=new Date(); d.setHours(0,0,0,0); return d.toISOString(); }
function sevenDaysAgo() { const d=new Date(); d.setDate(d.getDate()-7); d.setHours(0,0,0,0); return d.toISOString(); }
function dateInDays(n) { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function dayName(d) { return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }

function build7Days(sales) {
  const out = []; const now = new Date();
  for (let i=6; i>=0; i--) {
    const d = new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const end = new Date(d); end.setDate(end.getDate()+1);
    const rev = sales.filter(s=>{const t=new Date(s.recorded_at);return t>=d&&t<end;}).reduce((a,s)=>a+s.total,0);
    out.push({lbl:i===0?'Today':dayName(d), rev, tod:i===0});
  }
  return out;
}

function txRow(s, showDate) {
  const d = new Date(s.recorded_at);
  const ts = showDate && !isToday(d)
    ? d.toLocaleDateString('en-KE',{day:'numeric',month:'short'})
    : d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'});
  const cls = s.payment_method==='debt'?'debt':s.payment_method==='mpesa'?'mpesa':'';
  const icon = s.payment_method==='debt'?'📋':s.payment_method==='mpesa'?'📱':'💵';
  return `<div class="txi">
    <div class="tx-ico">${s.product_emoji||'📦'}</div>
    <div class="tx-inf">
      <div class="tx-nm">${s.product_name}</div>
      <div class="tx-mt">${s.customer_name} · ×${s.qty} · ${ts} ${icon}</div>
    </div>
    <div class="tx-amt ${cls}">${kes(s.total)}</div>
  </div>`;
}

function stockRow(p) {
  const max = Math.max(p.low_stock_at * 3, p.stock, 1);
  const pct = Math.min(100, Math.round(p.stock / max * 100));
  const isLow = p.stock <= p.low_stock_at;
  const col = isLow ? 'var(--red)' : pct > 65 ? 'var(--grn)' : 'var(--acc)';
  const margin = p.sell_price > 0 ? Math.round((p.sell_price - p.buy_price) / p.sell_price * 100) : 0;
  return `<div class="sti">
    <div class="st-ico">${p.emoji||'📦'}</div>
    <div class="st-inf"><div class="st-nm">${p.name}</div>
      <div class="st-pr">${kes(p.sell_price)} · ${margin}% margin</div>
    </div>
    <div class="st-lvl">
      <div class="st-cnt" style="${isLow?'color:var(--red)':''}">${p.stock} ${p.unit}</div>
      <div class="st-bar"><div class="st-fill" style="width:${pct}%;background:${col}"></div></div>
    </div>
  </div>`;
}

function isToday(d) {
  const n = new Date();
  return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}

        <input type="text" id="edit-shop-mpesa" class="fi" value="${esc(sh.mpesa_till||'')}" placeholder="e.g. 123456">
      </div>
      <button class="btn-p" onclick="saveShopDetails()">Save Changes</button>
      <button class="btn-g" onclick="popSheet()">Cancel</button>
    </div>`);
}

async function saveShopDetails() {
  const name     = document.getElementById('edit-shop-name')?.value.trim();
  const location = document.getElementById('edit-shop-location')?.value.trim();
  const mpesa    = document.getElementById('edit-shop-mpesa')?.value.trim();
  if (!name) { showToast('Shop name is required', true); return; }
  const btn = document.querySelector('.sh-body .btn-p');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const { error } = await apiPatch('shops', `id=eq.${S.shop.id}`, { name, location: location||null, mpesa_till: mpesa||null });
  if (error) { showToast('Error: ' + error.message, true); if(btn){btn.disabled=false;btn.textContent='Save Changes';} return; }
  S.shop.name = name; S.shop.location = location; S.shop.mpesa_till = mpesa;
  const hdr = document.getElementById('hdr-shop-name');
  if (hdr) hdr.textContent = name;
  popSheet();
  showToast('Shop details updated ✓');
}

/* ═══════════════════════════════
   EXPENSES
═══════════════════════════════ */
function catEmoji(cat) {
  return {Rent:'🏠',Utilities:'💡',Stock:'📦',Transport:'🚗',Salaries:'👷',Other:'💸'}[cat]||'💸';
}

async function showExpenses() {
  pushSheet(`<div class="sh-hand"></div><div class="sh-hdr"><h2>Expenses</h2></div><div class="sh-body"><div style="color:var(--txt2);text-align:center;padding:30px 0">Loading…</div></div>`);
  const rows = await apiGet(`expenses?shop_id=eq.${S.shop.id}&order=expense_date.desc&limit=100`);
  const thisMonth = rows?.filter(r => r.expense_date?.startsWith(new Date().toISOString().slice(0,7)))||[];
  const monthTotal = thisMonth.reduce((a,r)=>a+parseFloat(r.amount||0),0);
  const allTotal   = (rows||[]).reduce((a,r)=>a+parseFloat(r.amount||0),0);

  let list = '';
  (rows||[]).forEach(r => {
    list += `<div class="more-item">
      <div class="more-ico" style="background:#7c3aed22;font-size:20px">${catEmoji(r.category)}</div>
      <div class="more-inf">
        <div class="more-nm">${esc(r.description||r.category)}</div>
        <div class="more-mt">${r.category} · ${r.expense_date||''}</div>
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--red)">${kes(r.amount)}</div>
    </div>`;
  });

  const sheet = document.querySelector('.sh-body');
  if (!sheet) return;
  sheet.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="background:var(--surf2);border-radius:12px;padding:14px;text-align:center">
        <div style="font-size:11px;color:var(--txt2);margin-bottom:4px">This Month</div>
        <div style="font-size:18px;font-weight:800;color:var(--red)">${kes(monthTotal)}</div>
      </div>
      <div style="background:var(--surf2);border-radius:12px;padding:14px;text-align:center">
        <div style="font-size:11px;color:var(--txt2);margin-bottom:4px">All Time</div>
        <div style="font-size:18px;font-weight:800;color:var(--red)">${kes(allTotal)}</div>
      </div>
    </div>
    <div class="clist">${list||'<div style="color:var(--txt2);text-align:center;padding:20px 0">No expenses recorded yet</div>'}</div>
    <button class="btn-g" onclick="popSheet()">Close</button>`;

  // FAB
  addFab('+ Add Expense', openAddExpenseSheet);
}

function openAddExpenseSheet() {
  const today = new Date().toISOString().slice(0,10);
  pushSheet(`
    <div class="sh-hand"></div>
    <div class="sh-hdr"><h2>Add Expense</h2></div>
    <div class="sh-body">
      <div class="fg-s"><label class="fl">Category</label>
        <select id="exp-cat" class="fi">
          <option>Rent</option><option>Utilities</option><option>Stock</option>
          <option>Transport</option><option>Salaries</option><option selected>Other</option>
        </select>
      </div>
      <div class="fg-s"><label class="fl">Amount (KES)</label>
        <input type="number" id="exp-amt" class="fi" placeholder="0" min="1" inputmode="decimal">
      </div>
      <div class="fg-s"><label class="fl">Description</label>
        <input type="text" id="exp-desc" class="fi" placeholder="e.g. Monthly rent payment">
      </div>
      <div class="fg-s"><label class="fl">Date</label>
        <input type="date" id="exp-date" class="fi" value="${today}">
      </div>
      <button class="btn-p" onclick="saveExpense()">Save Expense</button>
      <button class="btn-g" onclick="popSheet()">Cancel</button>
    </div>`);
}

async function saveExpense() {
  const cat  = document.getElementById('exp-cat')?.value;
  const amt  = parseFloat(document.getElementById('exp-amt')?.value||0);
  const desc = document.getElementById('exp-desc')?.value.trim();
  const date = document.getElementById('exp-date')?.value;
  if (!amt || amt <= 0) { showToast('Enter a valid amount', true); return; }
  const btn = document.querySelector('.sh-body .btn-p');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const { error } = await apiPost('expenses', {
    shop_id: S.shop.id, category: cat, description: desc||null,
    amount: amt, expense_date: date||new Date().toISOString().slice(0,10),
    recorded_by: S.user.id,
  });
  if (error) { showToast('Error: ' + error.message, true); if(btn){btn.disabled=false;btn.textContent='Save Expense';} return; }
  popSheet();
  showToast(`${catEmoji(cat)} Expense saved — ${kes(amt)}`);
  showExpenses(); // refresh
}

async function saveSupplier() {
  const name     = document.getElementById('sup-name')?.value.trim();

  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

    shop_id: S.shop.id, name, phone: phone||null, supplies: supplies||null, notes: notes||null,
  });
  if (error) { showToast('Error: ' + error.message, true); if(btn){btn.disabled=false;btn.textContent='Save Supplier';} return; }

  showSuppliers(); // refresh
}

/* ═══════════════════════════════
   TOP CLIENTS
═══════════════════════════════ */
async function showTopClients() {
  pushSheet(`<div class="sh-hand"></div><div class="sh-hdr"><h2>Top Clients</h2></div><div class="sh-body"><div style="color:var(--txt2);text-align:center;padding:30px 0">Loading…</div></div>`);
  const sales = await apiGet(`sales?shop_id=eq.${S.shop.id}&customer_id=not.is.null&select=customer_id,customer_name,total&limit=1000`);

  // Aggregate by customer client-side
  const map = {};
  (sales||[]).forEach(s => {
    if (!s.customer_id) return;
    if (!map[s.customer_id]) map[s.customer_id] = { name: s.customer_name, total: 0, count: 0 };
    map[s.customer_id].total  += parseFloat(s.total||0);
    map[s.customer_id].count++;
  });

  const sorted = Object.values(map).sort((a,b)=>b.total-a.total);
  const medals = ['🥇','🥈','🥉'];

  let list = '';
  sorted.forEach((c, i) => {
    list += `<div class="more-item">
      <div class="more-ico" style="background:${i<3?'#d9770622':'var(--surf2)'};font-size:${i<3?'22':'16'}px">${medals[i]||'👤'}</div>
      <div class="more-inf">
        <div class="more-nm">${esc(c.name)}</div>
        <div class="more-mt">${c.count} purchase${c.count!==1?'s':''}</div>
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--grn)">${kes(c.total)}</div>
    </div>`;
  });

  const sheet = document.querySelector('.sh-body');
  if (!sheet) return;
  sheet.innerHTML = `
    ${sorted.length>0?`<div style="font-size:12px;color:var(--txt2);margin-bottom:10px">${sorted.length} client${sorted.length!==1?'s':''} ranked by total purchases</div>`:''}
    <div class="clist">${list||'<div style="color:var(--txt2);text-align:center;padding:20px 0">No client data yet — name customers when recording sales</div>'}</div>
    <button class="btn-g" onclick="popSheet()">Close</button>`;
}

/* ─── Sheet stack helpers ─── */
const _sheetStack = [];
function pushSheet(html) {
  const ov = document.getElementById('sale-overlay');
  const sh = document.getElementById('sale-sheet');
  _sheetStack.push(sh.innerHTML);
  sh.innerHTML = html;
  ov.classList.add('on');
}
function popSheet() {
  const ov = document.getElementById('sale-overlay');
  const sh = document.getElementById('sale-sheet');
  removeFab();
  if (_sheetStack.length) { sh.innerHTML = _sheetStack.pop(); }
  else { ov.classList.remove('on'); }
}

/* ─── Floating action button helper ─── */
let _fab = null;
function addFab(label, fn) {
  removeFab();
  _fab = document.createElement('button');
  _fab.className = 'btn-p';
  _fab.style.cssText = 'position:sticky;bottom:20px;left:0;right:0;margin:16px 0 0;z-index:10';
  _fab.textContent = label;
  _fab.onclick = fn;
  document.querySelector('.sh-body')?.appendChild(_fab);
}
function removeFab() { _fab?.remove(); _fab = null; }

/* ─── esc helper ─── */
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
